<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elsevier 논문 검색기</title>
    <style>
        :root { --primary: #007396; --bg: #f4f7f9; }
        body { font-family: 'Malgun Gothic', sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        h2 { color: var(--primary); text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        
        .setup-card { background: #fdfdfd; padding: 20px; border: 1px solid #e1e4e8; border-radius: 10px; margin-bottom: 20px; }
        .input-group { position: relative; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; font-size: 0.9em; }
        
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        
        /* 눈 버튼 스타일: 입력창 안쪽에 고정 */
        .toggle-password {
            position: absolute; right: 10px; top: 32px; /* 위치 조정 */
            background: none; border: none; cursor: pointer; font-size: 18px; color: #777;
            padding: 5px; z-index: 10;
        }
        
        .btn-search { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn-search:hover { background: #005a75; }
        .btn-search:disabled { background: #ccc; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 20px 0; }
        .btn-page { padding: 8px 15px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 4px; }
        
        .paper-card { padding: 15px; border-bottom: 1px solid #eee; }
        .paper-title { font-weight: bold; color: #1a0dab; text-decoration: none; margin-bottom: 5px; display: block; }
        #result-count { padding: 10px; font-weight: bold; border-radius: 5px; margin-bottom: 10px; display: none; background: #e7f3ff; color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔬 Elsevier Scopus 검색기</h2>

    <div class="setup-card">
        <div class="input-group">
            <label>1. API Key (보안)</label>
            <input type="password" id="apiKey" placeholder="API 키를 입력하세요">
            <button type="button" class="toggle-password" id="eyeBtn">👁️</button>
        </div>
        
        <div class="input-group">
            <label>2. 검색어</label>
            <input type="text" id="keyword" placeholder="주제 키워드 입력">
        </div>
        <button class="btn-search" id="searchBtn">논문 검색 시작</button>
    </div>

    <div id="result-count"></div>
    <div id="pagination-top" class="pagination"></div>
    <div id="paper-list"></div>
    <div id="pagination-bottom" class="pagination"></div>
</div>

<script src="script.js"></script>
</body>
</html>
