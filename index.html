<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Liz - Research Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h1>For Liz 💖</h1>
        </div>
        <div class="nav-item active">🔎 1. 논문 서치</div>
        <div class="nav-item" onclick="alert('AI 분석 기능 준비 중입니다!')">🤖 2. AI 결과</div>
        <a href="https://notebooklm.google.com/" target="_blank" class="nav-item">📓 3. Notebook LM</a>
    </div>

    <div class="main-content">
        <div class="container">
    <h2 style="color:var(--primary); margin-top:0; font-size: 1.5rem;">✨ Liz's Research Station</h2>
    
    <div class="setup-grid">
        
        <div class="setup-section">
            <div class="section-title">🔬 1. Elsevier Scopus</div>
            <div class="input-item">
                <label>API Key</label>
                <div class="pw-wrapper">
                    <input type="password" id="apiKey" class="small-input" style="width:100%" placeholder="Key">
                    <button type="button" class="toggle-small" id="eyeBtn">👁️</button>
                </div>
            </div>
            <div class="input-item">
                <label>검색 키워드</label>
                <input type="text" id="keyword" class="small-input" placeholder="주제 입력">
            </div>
            <div class="input-item">
                <label>검색 기간 (Year)</label>
                <div class="row-inputs">
                    <input type="number" id="startYear" class="small-input" placeholder="From">
                    <input type="number" id="endYear" class="small-input" placeholder="To">
                </div>
            </div>
        </div>

        <div class="setup-section">
            <div class="section-title">🤖 2. AI Intelligent</div>
            <div class="row-inputs" style="align-items: flex-end;">
                <div class="input-item" style="flex:1">
                    <label>AI Model</label>
                    <select id="aiModel" class="small-select">
                        <option value="gemini">Gemini (Google)</option>
                        <option value="gpt">ChatGPT (OpenAI)</option>
                    </select>
                </div>
                <div class="input-item" style="flex:2">
                    <label>AI API Key</label>
                    <input type="password" id="aiKey" class="small-input" placeholder="AI Key">
                </div>
            </div>
            <div class="input-item">
                <label>Research Question (max 50자)</label>
                <input type="text" id="resQuestion" class="small-input" maxlength="50" placeholder="핵심 질문을 입력하세요">
            </div>
        </div>

        <div class="setup-section">
            <div class="section-title">📓 3. Notebook LM</div>
            <div class="input-item">
                <label>Notebook LM API Key</label>
                <input type="password" id="noteKey" class="small-input" placeholder="Notebook Key">
            </div>
            <p style="font-size: 0.75rem; color: #94a3b8; margin: 5px 0;">* 소스 요약 및 팟캐스트 생성용</p>
        </div>
    </div>

    <div class="search-area">
        <button class="btn-main-search" id="searchBtn">보물 탐사 시작하기! 🚀</button>
    </div>

    <div id="result-count"></div>
    <div id="pagination-top" class="pagination"></div>
    <div id="paper-list"></div>
    <div id="pagination-bottom" class="pagination"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
