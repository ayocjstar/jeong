<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Elsevier 논문 검색기</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: auto; }
        .input-group { margin-bottom: 20px; }
        input { padding: 10px; width: 70%; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #007396; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #ccc; }
        #result-count { font-size: 1.2em; font-weight: bold; color: #d32f2f; margin: 20px 0; }
        .paper-item { border-bottom: 1px solid #eee; padding: 10px 0; }
        .paper-title { font-weight: bold; color: #1a0dab; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📄 Elsevier 논문 검색 (Scopus API)</h2>
        <div class="input-group">
            <input type="password" id="apiKey" placeholder="Elsevier API Key를 입력하세요">
            <input type="text" id="keyword" placeholder="검색어 입력">
            <button id="searchBtn">검색</button>
        </div>

        <div id="result-count"></div>
        
        <div id="paper-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
